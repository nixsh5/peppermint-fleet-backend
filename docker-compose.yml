services:
  broker:
    image: eclipse-mosquitto:2
    container_name: fleet-mqtt-broker
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 | grep -v Error || exit 0"]
      interval: 3s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fleet-backend-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MQTT_BROKER_HOST=broker
      - MQTT_BROKER_PORT=1883
    volumes:
      - ./tests:/app/tests:ro
      - ./pytest.ini:/app/pytest.ini:ro
    depends_on:
      broker:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 3s
      retries: 5

  simulator:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    container_name: fleet-simulator
    restart: "no"
    environment:
      - MQTT_BROKER_HOST=broker
      - MQTT_BROKER_PORT=1883
      - DATA_DIR=/app/data
      - REPLAY_SPEED_FACTOR=5.0
    volumes:
      - ./data:/app/data:ro
    depends_on:
      backend:
        condition: service_healthy